name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm ci

      - name: Build web app (production)
        run: |
          npm run build

      - name: Install Java (required for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Install Android SDK components
        uses: reactivecircus/android-sdk@v2
        with:
          api-level: 33
          build-tools: 33.0.2
          components: "platform-tools;platforms;build-tools;cmdline-tools"

      - name: Install Capacitor CLI
        run: |
          npm install -g @capacitor/cli@5

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android --npm-client=npm
          fi

      - name: Sync web assets into Android project
        run: |
          npx cap copy android

      - name: Build Android debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug -Pandroid.injected.testOnly=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
